name: Release Agent

on:
  push:
    tags:
      - "agent/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. agent/v1.2.0)"
        required: true

permissions:
  contents: write   # create releases, upload assets
  packages: read

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Validate tag & resolve version ──────────────────────────────────────────
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog

      - name: Parse tag & version
        id: parse
        run: |
          # Support both push trigger and manual dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG#agent/v}"

          # Pre-release if contains alpha/beta/rc
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            IS_PRE=true
          else
            IS_PRE=false
          fi

          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "Releasing: ${TAG} → v${VERSION} (pre=${IS_PRE})"

      - name: Find previous agent tag
        id: prev
        run: |
          PREV=$(git tag --sort=-version:refname \
            | grep '^agent/v' \
            | grep -v "^${{ steps.parse.outputs.tag }}$" \
            | head -1 || echo "")
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

  # ── Build release assets ────────────────────────────────────────────────────
  build-assets:
    name: Build release assets
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version into install scripts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^REGRAPH_VERSION=.*/REGRAPH_VERSION=\"${VERSION}\"/" public/scripts/install.sh
          sed -i "s/^\$REGRAPH_VERSION =.*$/\$REGRAPH_VERSION = \"${VERSION}\"/" public/scripts/install.ps1

      - name: Build Python sdist + wheel
        run: |
          pip install --quiet build
          cd agent
          python -m build --sdist --wheel --outdir ../dist/

      - name: List artifacts
        run: ls -lh dist/ public/scripts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/
            public/scripts/install.sh
            public/scripts/install.ps1
          retention-days: 1

  # ── Generate changelog ──────────────────────────────────────────────────────
  changelog:
    name: Generate changelog
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.gen.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: gen
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Range: from previous agent tag to current, scoped to agent/ path
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          echo "Git range: ${RANGE}"

          # Collect commits touching agent/ (or no path filter if none)
          COMMITS=$(git log "$RANGE" \
            --pretty=format:"%H|%s|%an" \
            -- "agent/" \
            2>/dev/null || \
          git log "$RANGE" \
            --pretty=format:"%H|%s|%an" \
            2>/dev/null)

          # Categorize by conventional commit prefix
          FEATURES=""
          FIXES=""
          BREAKING=""
          PERF=""
          DOCS=""
          CI=""
          OTHER=""

          while IFS='|' read -r hash subject author; do
            short="${hash:0:7}"
            line="- ${subject} ([\`${short}\`](https://github.com/${{ github.repository }}/commit/${hash})) — ${author}"

            if echo "$subject" | grep -qiE '^(feat|feature)(\(.+\))?!?:'; then
              FEATURES="${FEATURES}\n${line}"
            elif echo "$subject" | grep -qiE '^(fix|bug)(\(.+\))?:'; then
              FIXES="${FIXES}\n${line}"
            elif echo "$subject" | grep -qiE '^(break|BREAKING)'; then
              BREAKING="${BREAKING}\n${line}"
            elif echo "$subject" | grep -qiE '^perf(\(.+\))?:'; then
              PERF="${PERF}\n${line}"
            elif echo "$subject" | grep -qiE '^(docs?|readme)(\(.+\))?:'; then
              DOCS="${DOCS}\n${line}"
            elif echo "$subject" | grep -qiE '^(ci|cd|build|docker|workflow)(\(.+\))?:'; then
              CI="${CI}\n${line}"
            else
              OTHER="${OTHER}\n${line}"
            fi
          done <<< "$COMMITS"

          # Build markdown body
          BODY="## What's Changed in v${VERSION}\n\n"

          if [[ -n "$BREAKING" ]]; then
            BODY="${BODY}### ⚠️ Breaking Changes\n${BREAKING}\n\n"
          fi
          if [[ -n "$FEATURES" ]]; then
            BODY="${BODY}### ✨ New Features\n${FEATURES}\n\n"
          fi
          if [[ -n "$FIXES" ]]; then
            BODY="${BODY}### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi
          if [[ -n "$PERF" ]]; then
            BODY="${BODY}### ⚡ Performance\n${PERF}\n\n"
          fi
          if [[ -n "$DOCS" ]]; then
            BODY="${BODY}### 📖 Documentation\n${DOCS}\n\n"
          fi
          if [[ -n "$CI" ]]; then
            BODY="${BODY}### 🔧 CI / Build\n${CI}\n\n"
          fi
          if [[ -n "$OTHER" ]]; then
            BODY="${BODY}### 🔄 Other Changes\n${OTHER}\n\n"
          fi

          if [[ -z "$COMMITS" ]]; then
            BODY="${BODY}_No commits found in range ${RANGE}_\n\n"
          fi

          # Installation section
          BODY="${BODY}---\n\n"
          BODY="${BODY}## 📦 Installation\n\n"
          BODY="${BODY}\`\`\`bash\n"
          BODY="${BODY}# Linux / macOS\n"
          BODY="${BODY}curl -fsSL https://regraph.tech/scripts/install.sh | bash\n\n"
          BODY="${BODY}# Windows (PowerShell)\n"
          BODY="${BODY}irm https://regraph.tech/scripts/install.ps1 | iex\n\n"
          BODY="${BODY}# pip\n"
          BODY="${BODY}pip install regraph-agent==${VERSION}\n\n"
          BODY="${BODY}# Docker — CPU\n"
          BODY="${BODY}docker pull ghcr.io/${{ github.repository_owner }}/regraph-agent:${VERSION}-cpu\n\n"
          BODY="${BODY}# Docker — NVIDIA CUDA 12.1\n"
          BODY="${BODY}docker pull ghcr.io/${{ github.repository_owner }}/regraph-agent:${VERSION}-nvidia\n"
          BODY="${BODY}\`\`\`\n\n"
          BODY="${BODY}**Full docs:** https://regraph.tech/docs/agent\n"

          # Prev release link
          if [[ -n "$PREV_TAG" ]]; then
            PREV_VERSION="${PREV_TAG#agent/v}"
            BODY="${BODY}\n**Full Changelog:** [\`${PREV_VERSION}...${VERSION}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG})"
          fi

          # Write to file (handles multiline for GITHUB_OUTPUT)
          printf '%b' "$BODY" > /tmp/changelog.md
          cat /tmp/changelog.md

          # Pass via output (escape newlines)
          {
            echo 'body<<EOF'
            cat /tmp/changelog.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  # ── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [prepare, build-assets, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ./assets

      - name: List downloaded assets
        run: find ./assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Agent v${{ needs.prepare.outputs.version }}"
          body: ${{ needs.changelog.outputs.body }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
          fail_on_unmatched_files: false
          files: |
            assets/public/scripts/install.sh
            assets/public/scripts/install.ps1
            assets/dist/*.whl
            assets/dist/*.tar.gz

  # ── Trigger Docker build after release ─────────────────────────────────────
  trigger-docker:
    name: Trigger Docker image build
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docker-agent workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-agent.yml',
              ref: '${{ needs.prepare.outputs.tag }}',
              inputs: {
                targets: 'cpu,nvidia,dev',
                push: 'true',
              },
            });
            console.log('Triggered docker-agent.yml build');

  # ── Step summary ────────────────────────────────────────────────────────────
  summary:
    name: Release summary
    needs: [prepare, release, trigger-docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.prepare.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ needs.prepare.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-release | \`${{ needs.prepare.outputs.is_prerelease }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker trigger | ${{ needs.trigger-docker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
