[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "regraph-agent"
version = "1.2.0"
description = "ReGraph Provider Agent — contribute compute to the decentralized AI network"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ReGraph", email = "engineering@regraph.tech" }]

dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "psutil>=5.9,<7",
  "click>=8.1,<9",
  "pydantic>=2.0,<3",
  "rich>=13.0,<14",
]

[project.optional-dependencies]
# NVIDIA GPU — high-throughput inference
nvidia = [
  "llama-cpp-python>=0.2.90",
  "GPUtil>=1.4",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
  "vllm>=0.4.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# Apple Silicon — Metal/MPS inference
metal = [
  "llama-cpp-python>=0.2.90",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# AMD ROCm
rocm = [
  "llama-cpp-python>=0.2.90",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# Windows DirectML (Intel/AMD/NVIDIA on Windows)
directml = [
  "torch-directml>=0.2.0",
  "onnxruntime-directml>=1.18.0",
  "transformers>=4.40.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# Huawei Ascend NPU (CANN 6.x+ / Atlas inference cards)
ascend = [
  "torch>=2.1.0",
  "torch_npu>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# CPU-only (any platform)
cpu = [
  "llama-cpp-python>=0.2.90",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "onnxruntime>=1.18.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# Minimal GPU support (no vLLM — faster install)
gpu = [
  "llama-cpp-python>=0.2.90",
  "GPUtil>=1.4",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
]

# Full installation (everything)
all = [
  "llama-cpp-python>=0.2.90",
  "GPUtil>=1.4",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
  "sentence-transformers>=3.0.0",
  "huggingface-hub>=0.22.0",
  "onnxruntime>=1.18.0",
  "datasets>=2.19.0",
]

[project.scripts]
regraph-agent = "regraph_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
