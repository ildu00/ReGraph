[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "regraph-agent"
version = "1.2.0"
description = "ReGraph Provider Agent — contribute compute to the decentralized AI network"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ReGraph", email = "engineering@regraph.tech" }]

dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "psutil>=5.9,<7",
  "click>=8.1,<9",
  "pydantic>=2.0,<3",
  "rich>=13.0,<14",
]

[project.optional-dependencies]
gpu = ["GPUtil>=1.4"]

[project.scripts]
regraph-agent = "regraph_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
